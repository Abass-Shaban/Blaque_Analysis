<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BLAQUE ANALYSIS logo">
  <defs>
    <linearGradient id="silver" x1="104" y1="84" x2="408" y2="436" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#e9eef3"/>
      <stop offset="0.38" stop-color="#b7c0ca"/>
      <stop offset="0.52" stop-color="#7e8895"/>
      <stop offset="0.66" stop-color="#e6ebf0"/>
      <stop offset="0.84" stop-color="#a8b2bd"/>
      <stop offset="1" stop-color="#69737f"/>
    </linearGradient>
    <linearGradient id="blue" x1="148" y1="146" x2="386" y2="388" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a8d4ff"/>
      <stop offset="0.34" stop-color="#3f8dff"/>
      <stop offset="0.7" stop-color="#1d63e8"/>
      <stop offset="1" stop-color="#123f9f"/>
    </linearGradient>
    <linearGradient id="blueThin" x1="360" y1="150" x2="150" y2="364" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#79b4ff"/>
      <stop offset="1" stop-color="#1a55c9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#25d162" stop-opacity="0.20"/>
      <stop offset="0.62" stop-color="#25d162" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#25d162" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="#161716"/>
  <rect width="512" height="512" rx="118" fill="url(#glow)"/>
  <rect x="10" y="10" width="492" height="492" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="2"/>

  <g filter="url(#drop)">
    <circle cx="256" cy="256" r="148" fill="none" stroke="url(#silver)" stroke-width="46"/>
    <circle cx="256" cy="256" r="148" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="256" cy="256" r="124" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
  </g>

  <g stroke-linecap="round">
    <line x1="148" y1="148" x2="372" y2="372" stroke="url(#blue)" stroke-width="42"/>
    <line x1="360" y1="150" x2="152" y2="358" stroke="url(#blueThin)" stroke-width="26" opacity="0.92"/>
  </g>

  <circle cx="396" cy="116" r="27" fill="#25d162" opacity="0.22" filter="url(#soft)"/>
  <circle cx="396" cy="116" r="13" fill="#25d162"/>
</svg>
